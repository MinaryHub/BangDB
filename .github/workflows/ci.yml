name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: crash torture
        shell: bash
        env:
          BANGDB_TORTURE: "30"
        run: go test -count=1 -run TestCrashTorture .
      - name: crash torture (encrypted)
        shell: bash
        env:
          BANGDB_TORTURE: "15"
          BANGDB_TORTURE_ENCRYPT: "1"
        run: go test -count=1 -run TestCrashTorture .
      - name: memory store variant
        shell: bash
        env:
          BANGDB_TEST_STORE: memory
        run: go test -count=1 .

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/engine -run '^$' -fuzz FuzzExec -fuzztime 60s
      - run: go test ./internal/sql -run '^$' -fuzz FuzzParse -fuzztime 30s
      - run: go test ./internal/store -run '^$' -fuzz FuzzDecodeBlock -fuzztime 30s

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version counts commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: bangdb-binaries
          path: dist/
